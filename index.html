<style>
/* Layout: one-screen app — itinerary column on the left, hand-drawn map of Gyeongsang on the right; on phones the map sits on top and the list scrolls below. */
:root{
  --bg:#EDF1EC;          /* celadon-paper ground */
  --panel:#F8FAF6;
  --ink:#1D2827;
  --muted:#5B6A66;
  --line:#CCD6CF;
  --accent:#B98614;      /* ginkgo gold */
  --accent-soft:#F3E6C2;
  --land:#F6F7F1;
  --sea:#D3E2E3;
  --sea-ink:#6E9196;
  --river:#A9C6CB;
  --grid:#E2E7E0;
  --halo:#F6F7F1;
  --d1:#B5452B; --d2:#B98614; --d3:#2F7F86; --d4:#3F7D4F; --d5:#7E4C86; --d6:#3E5196; --d7:#6B5E4C;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ko:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816;--panel:#161F1C;--ink:#E3E9E4;--muted:#93A39E;--line:#2C3934;--accent:#E0B23F;--accent-soft:#3A3120;
  --land:#1A231F;--sea:#0F1C1F;--sea-ink:#5F858A;--river:#28464B;--grid:#212C28;--halo:#1A231F;
  --d1:#E07A5E;--d2:#E0B23F;--d3:#5DB3B9;--d4:#74B583;--d5:#B88AC0;--d6:#8597D8;--d7:#B3A48D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816;--panel:#161F1C;--ink:#E3E9E4;--muted:#93A39E;--line:#2C3934;--accent:#E0B23F;--accent-soft:#3A3120;
  --land:#1A231F;--sea:#0F1C1F;--sea-ink:#5F858A;--river:#28464B;--grid:#212C28;--halo:#1A231F;
  --d1:#E07A5E;--d2:#E0B23F;--d3:#5DB3B9;--d4:#74B583;--d5:#B88AC0;--d6:#8597D8;--d7:#B3A48D;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden}
*{box-sizing:border-box}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(340px,430px) 1fr;grid-template-rows:100%}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
header{padding:20px 20px 12px;display:grid;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:5px 10px 4px;cursor:pointer;font:inherit;display:grid;justify-items:center;line-height:1.2;min-width:52px}
.tab b{font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.tab small{font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--dc,var(--ink));border-color:var(--dc,var(--ink));color:var(--panel)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}

.list{flex:1;overflow-y:auto;padding:4px 20px 28px;min-height:0}
.day{padding-top:18px}
.day-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.day-head .num{font-family:var(--f-mono);font-size:12px;color:var(--panel);background:var(--dc);border-radius:4px;padding:1px 6px}
.day-head h2{font-family:var(--f-display);font-size:19px;margin:0;font-weight:600}
.day-head .date{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.banner{margin:8px 0 6px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font-size:13px}
.daynote{font-size:13px;color:var(--muted);margin:4px 0 6px}

.stops{list-style:none;margin:6px 0 0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;border-left:2px dotted var(--line)}
.stop{position:relative}
.stop-btn{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 6px 8px 0;cursor:pointer;border-radius:8px}
.stop-btn:hover .name{color:var(--dc)}
.stop-btn:focus-visible{outline:2px solid var(--accent)}
.pin{width:28px;height:28px;border-radius:50%;background:var(--panel);border:2px solid var(--dc);color:var(--dc);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;position:relative;z-index:1}
.stop.hotel .pin{border-radius:6px}
.stop.optional .pin{border-style:dashed}
.stop.text .pin{border-color:var(--line);color:var(--muted)}
.stop.active .pin{background:var(--dc);color:var(--panel)}
.meta{min-width:0}
.time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.name{font-weight:500;font-size:15.5px;line-height:1.35;display:block}
.ko{font-family:var(--f-ko);font-size:13px;color:var(--muted);margin-left:6px;font-weight:400}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:2px}
.detail{margin:2px 0 8px 38px;padding:10px 12px;border-left:2px solid var(--dc);background:var(--bg);border-radius:0 8px 8px 0;font-size:13.5px;display:grid;gap:8px}
.detail p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--panel);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.links a{color:var(--dc);text-underline-offset:3px}
.route{display:grid;gap:6px}
.route div{padding:6px 8px;background:var(--panel);border-radius:6px;border:1px solid var(--line)}
.route b{font-weight:500}

.mapwrap{position:relative;min-width:0;min-height:0;background:var(--sea);overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map.dragging{cursor:grabbing}
.zoom{position:absolute;right:14px;top:14px;display:grid;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer;font-family:var(--f-mono)}
.legend{position:absolute;left:14px;bottom:14px;max-width:calc(100% - 28px);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.mk{cursor:pointer}
.mk text{pointer-events:none}

@media (max-width:760px){
  .app{grid-template-columns:100%;grid-template-rows:auto 40vh minmax(0,1fr)}
  .side{display:contents}
  header{grid-row:1;background:var(--panel);padding:14px 16px 8px}
  h1{font-size:21px}
  .mapwrap{grid-row:2;border-block:1px solid var(--line)}
  .lower{grid-row:3;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  .tabs,.list{padding-left:16px;padding-right:16px}
}
@media (min-width:761px){.lower{display:contents}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const GEUMHO=[[36.00,128.98],[35.95,128.85],[35.90,128.72],[35.88,128.62],[35.86,128.52],[35.85,128.47]];
const TAEHWA=[[35.56,129.10],[35.55,129.20],[35.55,129.30],[35.52,129.37]];

const NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const pts=a=>a.map(([la,lo])=>P(la,lo).join(",")).join(" ");
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const svg=document.getElementById("map"), base=document.getElementById("base"), gR=document.getElementById("routes"), gM=document.getElementById("marks");

// base layer
el("rect",{x:-2000,y:-2000,width:W+4000,height:H+4000,fill:"var(--land)"},base);
for(let lo=128.25;lo<129.8;lo+=0.25) el("line",{x1:px(lo),y1:0,x2:px(lo),y2:H,stroke:"var(--grid)","vector-effect":"non-scaling-stroke"},base);
for(let la=35.0;la<36.2;la+=0.25) el("line",{x1:0,y1:py(la),x2:W,y2:py(la),stroke:"var(--grid)","vector-effect":"non-scaling-stroke"},base);
const seaPts=pts(COAST)+` ${px(127.5)},${py(34.5)} ${px(130.5)},${py(34.5)} ${px(130.5)},${py(36.6)} ${px(129.40)},${py(36.6)}`;
el("polygon",{points:seaPts,fill:"var(--sea)",stroke:"var(--sea-ink)","stroke-width":1.2,"stroke-linejoin":"round","vector-effect":"non-scaling-stroke"},base);
[NAKDONG,GEUMHO,TAEHWA].forEach((r,i)=>el("polyline",{points:pts(r),fill:"none",stroke:"var(--river)","stroke-width":i?2:3.5,"stroke-linecap":"round","stroke-linejoin":"round","vector-effect":"non-scaling-stroke"},base));
const scaled=[]; // [element, basePx, attr]
const seaLabels=[["東　海",35.70,129.66],["南　海",35.00,129.30],["洛東江",35.62,128.36]];
seaLabels.forEach(([t,la,lo],i)=>{const e=el("text",{x:px(lo),y:py(la),"text-anchor":"middle",fill:i<2?"var(--sea-ink)":"var(--river)","font-family":"var(--f-display)","letter-spacing":"0.3em"},base);e.textContent=t;scaled.push([e,i<2?15:12])});
CITIES.forEach(([t,la,lo])=>{const e=el("text",{x:px(lo),y:py(la),"text-anchor":"middle",fill:"var(--muted)",opacity:.55,"font-family":"var(--f-display)","font-weight":600},base);e.textContent=t;scaled.push([e,17,"city"])});

// ---------- View state ----------
let cx=W/2, cy=H/2, upp=1; // units per pixel
function size(){const r=svg.getBoundingClientRect();return [Math.max(r.width,1),Math.max(r.height,1)]}
const maxUpp=()=>{const [w,h]=size();return Math.max(W/w,H/h)*1.05};
const MINUPP=0.035;
function apply(){
  const [w,h]=size();
  svg.setAttribute("viewBox",`${cx-w*upp/2} ${cy-h*upp/2} ${w*upp} ${h*upp}`);
  scaled.forEach(([e,s,k])=>{e.setAttribute("font-size",s*upp); if(k==="city") e.setAttribute("opacity", upp<0.25?0.25:0.55)});
  renderMarks();
}
let anim=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function flyTo(nx,ny,nu,dur=650){
  nu=Math.min(Math.max(nu,MINUPP),maxUpp());
  cancelAnimationFrame(anim);
  if(reduce){cx=nx;cy=ny;upp=nu;apply();return}
  const sx=cx,sy=cy,su=Math.log(upp),eu=Math.log(nu),t0=performance.now();
  const step=t=>{let k=Math.min((t-t0)/dur,1);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    cx=sx+(nx-sx)*k;cy=sy+(ny-sy)*k;upp=Math.exp(su+(eu-su)*k);apply();if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function fit(list){
  const p=list.filter(s=>s.lat).map(s=>P(s.lat,s.lng));
  if(!p.length)return;
  const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const [w,h]=size();
  flyTo((x0+x1)/2,(y0+y1)/2,Math.max((x1-x0)/(w-90),(y1-y0)/(h-110),MINUPP*3)*1.0);
}

// ---------- State & rendering ----------
let day=-1, active=null; // day -1 = whole trip
const dc=i=>`var(--d${i+1})`;
function renderMarks(){
  gR.innerHTML="";gM.innerHTML="";
  const u=upp;
  D.forEach((dd,i)=>{
    const show=day===-1||day===i;
    const geo=dd.stops.filter(s=>s.lat);
    if(show){
      el("polyline",{points:geo.map(s=>P(s.lat,s.lng).join(",")).join(" "),fill:"none",stroke:dc(i),"stroke-width":day===-1?2:2.5,"stroke-dasharray":"6 5","stroke-linejoin":"round",opacity:day===-1?.7:.9,"vector-effect":"non-scaling-stroke"},gR);
    }
  });
  // faint context dots for other days
  if(day!==-1) D.forEach((dd,i)=>{ if(i===day)return; dd.stops.forEach(s=>{ if(!s.lat)return; const [x,y]=P(s.lat,s.lng); el("circle",{cx:x,cy:y,r:3.5*u,fill:"var(--muted)",opacity:.35},gM)})});
  const items=[];
  D.forEach((dd,i)=>{ if(day!==-1&&day!==i)return; let n=0;
    dd.stops.forEach((s,j)=>{ if(s.text)return; n++; if(!s.lat)return; items.push({s,i,j,n}) })});
  // draw active last
  items.sort((a,b)=>(isAct(a)?1:0)-(isAct(b)?1:0));
  const seen=new Set();
  items.forEach(it=>{
    const {s,i,j,n}=it,[x,y]=P(s.lat,s.lng),act=isAct(it);
    const key=s.lat+","+s.lng+","+i;
    const g=el("g",{class:"mk",tabindex:-1},gM);
    g.addEventListener("click",e=>{e.stopPropagation();select(i,j,true)});
    el("title",{},g).textContent=`${D[i].d} ${s.n}`;
    const r=(day===-1?6:11)*u*(act?1.25:1);
    if(s.hotel) el("rect",{x:x-r,y:y-r,width:2*r,height:2*r,rx:3*u,fill:act?dc(i):"var(--panel)",stroke:dc(i),"stroke-width":2,"vector-effect":"non-scaling-stroke"},g);
    else el("circle",{cx:x,cy:y,r,fill:act?dc(i):"var(--panel)",stroke:dc(i),"stroke-width":2,"stroke-dasharray":s.opt?"3 2":"none","vector-effect":"non-scaling-stroke"},g);
    if(day!==-1&&!seen.has(key)){const t=el("text",{x,y:y+4*u,"text-anchor":"middle","font-size":11.5*u,"font-family":"var(--f-mono)","font-weight":500,fill:act?"var(--panel)":dc(i)},g);t.textContent=s.hotel?"宿":n}
    seen.add(key);
    if(act){
      const lab=s.n.replace(/（.*?）/g,"");
      const t=el("text",{x:x+r+6*u,y:y+5*u,"font-size":14*u,"font-weight":700,"font-family":"var(--f-body)",fill:"var(--ink)",stroke:"var(--halo)","stroke-width":4,"paint-order":"stroke","stroke-linejoin":"round","vector-effect":"non-scaling-stroke"},g);t.textContent=lab;
    }
  });
}
const isAct=it=>active&&active[0]===it.i&&active[1]===it.j;

const tabs=document.getElementById("tabs"), list=document.getElementById("list"), legend=document.getElementById("legend");
function buildTabs(){
  const mk=(i,b,s)=>{const t=document.createElement("button");t.className="tab";t.setAttribute("role","tab");if(i>=0)t.style.setProperty("--dc",dc(i));t.innerHTML=`<b>${b}</b><small>${s}</small>`;t.onclick=()=>setDay(i);tabs.appendChild(t);return t};
  mk(-1,"全程","7 天");
  D.forEach((d,i)=>mk(i,d.d,"週"+d.w));
}
const naver=q=>"https://map.naver.com/p/search/"+encodeURIComponent(q);
const gmap=(s)=>`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
function buildList(){
  list.innerHTML="";
  D.forEach((dd,i)=>{
    if(day!==-1&&day!==i)return;
    const sec=document.createElement("section");sec.className="day";sec.style.setProperty("--dc",dc(i));
    sec.innerHTML=`<div class="day-head"><span class="num">D${i+1}</span><span class="date">${dd.d}（${dd.w}）</span><h2>${dd.title}</h2></div>`+(dd.banner?`<div class="banner">${dd.banner}</div>`:"");
    const ul=document.createElement("ol");ul.className="stops";
    let n=0;
    dd.stops.forEach((s,j)=>{
      if(!s.text)n++;
      const li=document.createElement("li");
      const act=active&&active[0]===i&&active[1]===j;
      li.className="stop"+(s.hotel?" hotel":"")+(s.opt?" optional":"")+(s.text?" text":"")+(act?" active":"");
      const b=document.createElement("button");b.className="stop-btn";b.setAttribute("aria-expanded",act);
      b.innerHTML=`<span class="pin">${s.text?"·":s.hotel?"宿":n}</span><span class="meta"><span class="time">${s.t}</span><span class="name">${s.n}${s.opt?'<span class="tag">視情況</span>':""}${s.tag?`<span class="tag">${s.tag}</span>`:""}${s.ko&&!s.hotel?`<span class="ko">${s.ko}</span>`:""}</span></span>`;
      b.onclick=()=>select(i,j,false);
      li.appendChild(b);
      if(act){
        const d=document.createElement("div");d.className="detail";let h="";
        if(s.note)h+=`<p>${s.note}</p>`;
        if(s.sched)h+=s.sched.map(([k,v])=>`<div><div class="time">${k}</div><div class="chips">${v.split(" ").reduce((a,x)=>{/^\d/.test(x)?a.push(x):a[a.length-1]+=" "+x;return a},[]).map(c=>`<span class="chip">${c}</span>`).join("")}</div></div>`).join("");
        if(s.routes)h+=`<div class="route">${s.routes.map(([k,v])=>`<div><b>${k}</b><br>${v}</div>`).join("")}</div>`;
        const L=[...(s.links||[])];
        if(s.lat){L.push(["Naver 地圖",naver(s.ko||s.n)]);L.push(["Google 地圖",gmap(s)])}
        if(L.length)h+=`<div class="links">${L.map(([k,u])=>`<a href="${u}" target="_blank" rel="noopener">${k} ↗</a>`).join("")}</div>`;
        if(s.approx)h+=`<p class="time">地圖位置為約略，出發前請以 Naver 地圖確認。</p>`;
        if(s.text)h+=`<p class="time">沒有固定地點。</p>`;
        d.innerHTML=h;li.appendChild(d);
      }
      ul.appendChild(li);
    });
    sec.appendChild(ul);list.appendChild(sec);
  });
}
function setDay(i,keepActive){
  day=i; if(!keepActive)active=null;
  [...tabs.children].forEach((t,k)=>t.setAttribute("aria-selected",k===i+1));
  tabs.children[i+1].scrollIntoView({block:"nearest",inline:"nearest"});
  legend.innerHTML=(i===-1?D.map((d,k)=>`<span><i style="background:${dc(k)}"></i>${d.d}</span>`).join(""):`<span><i style="background:${dc(i)}"></i>${D[i].d} ${D[i].title}</span>`)+`<span>虛線為順序示意，非實際路線</span>`;
  buildList();
  if(!keepActive){fit(i===-1?D.flatMap(d=>d.stops):D[i].stops);list.scrollTop=0}
  else apply();
}
function select(i,j,fromMap){
  const same=active&&active[0]===i&&active[1]===j;
  if(day!==-1&&day!==i||fromMap&&day===-1)setDay(i,true);
  active=same&&!fromMap?null:[i,j];
  buildList();
  const s=D[i].stops[j];
  if(active&&s.lat) flyTo(px(s.lng),py(s.lat),Math.min(upp,0.09));
  else apply();
  if(fromMap){const li=list.querySelector(".stop.active");li&&li.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"})}
}

// ---------- Pan / zoom ----------
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,cx,cy,moved:false,id:e.pointerId}});
svg.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;svg.classList.add("dragging");try{svg.setPointerCapture(drag.id)}catch(_){}}if(drag.moved){cancelAnimationFrame(anim);cx=drag.cx-dx*upp;cy=drag.cy-dy*upp;apply()}});
const end=()=>{drag=null;svg.classList.remove("dragging")};
svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
svg.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(anim);
  const r=svg.getBoundingClientRect(),[w,h]=size();
  const mx=cx+(e.clientX-r.left-w/2)*upp,my=cy+(e.clientY-r.top-h/2)*upp;
  const nu=Math.min(Math.max(upp*Math.exp(e.deltaY*0.0015),MINUPP),maxUpp());
  cx=mx-(mx-cx)*nu/upp;cy=my-(my-cy)*nu/upp;upp=nu;apply()},{passive:false});
document.getElementById("zin").onclick=()=>flyTo(cx,cy,upp/1.8,300);
document.getElementById("zout").onclick=()=>flyTo(cx,cy,upp*1.8,300);
document.getElementById("zfit").onclick=()=>fit(day===-1?D.flatMap(d=>d.stops):D[day].stops);
let rT;addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(apply,80)});

// mobile: tabs live inside lower panel
buildTabs();
upp=maxUpp();apply();
setDay(-1);
</script>
